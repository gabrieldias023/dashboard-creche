name: Backfill 2026 (rodar uma vez)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot-ig
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar backfill do histórico
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node backfill.js

      - name: Commitar JSON se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain snapshots_ig.json)" ]; then
            git add snapshots_ig.json
            git commit -m "chore: backfill historico 2026"
            git push
            echo "Backfill commitado."
          else
            echo "Sem mudancas; nada a commitar."
          fi
