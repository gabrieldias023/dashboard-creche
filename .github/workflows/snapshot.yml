name: Snapshot IG diário

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot-ig
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coletar snapshot do dia
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node fetch.js

      - name: Commitar JSON se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain snapshots_ig.json)" ]; then
            git add snapshots_ig.json
            git commit -m "chore: snapshot IG $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot commitado."
          else
            echo "Sem mudancas; nada a commitar."
          fi
